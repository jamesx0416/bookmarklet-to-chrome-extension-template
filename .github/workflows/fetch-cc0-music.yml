name: Fetch CC0 music

on:
  push:
    paths:
      - .github/workflows/fetch-cc0-music.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download CC0 track
        run: |
          curl --fail --location --retry 3 --output remember-the-time.ogg "https://upload.wikimedia.org/wikipedia/commons/d/d8/Komiku_-_02_-_Remember_the_time_we_use_to_play.ogg"
          test "$(stat -c%s remember-the-time.ogg)" -gt 1000000
          rm -rf .cc0_audio
          mkdir .cc0_audio
          stat -c%s remember-the-time.ogg > .cc0_audio/size.txt
          sha256sum remember-the-time.ogg > .cc0_audio/sha256.txt
          printf '%s\n' "$GITHUB_RUN_ID" > .cc0_audio/run_id.txt
      - name: Upload music artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc0-background-music
          path: remember-the-time.ogg
          retention-days: 1
      - name: Commit transfer metadata temporarily
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cc0_audio
          git commit -m "Update temporary CC0 music transfer metadata"
          git push
